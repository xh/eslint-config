# Deploy Release — Publishes a numbered release to npm. Manually triggered from master
# (or a dedicated branch for hotfixes). Validates the version, publishes, tags the
# commit, and creates a GitHub release. For snapshot builds, see Deploy Snapshot.

name: Deploy Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Release Version'
                required: true
                type: string
            is-hotfix:
                description: 'Check when releasing a hotfix to a version *other than* the latest.'
                required: true
                default: false
                type: boolean

# Run release builds one-by-one; never cancel one due to another.
concurrency:
    group: deploy-release
    cancel-in-progress: false

jobs:
    build:
        # Guards against accidental release from develop. Requires master for standard
        # releases and a branch other than master (or develop) when is-hotfix is set.
        if: github.ref != 'refs/heads/develop' && ((github.ref == 'refs/heads/master') != inputs.is-hotfix)

        runs-on: ubuntu-latest
        permissions:
            contents: write
            # Lets pnpm publish via npm trusted publishing (OIDC), with provenance. npm allows
            # one trusted publisher config per package - ours names this workflow, so Deploy
            # Snapshot uses the static NPM_TOKEN instead.
            id-token: write
        # setup-node's .npmrc references ${NODE_AUTH_TOKEN} - a placeholder keeps non-publish
        # steps warning-free. The real token is scoped to the publish step only.
        env:
            NODE_AUTH_TOKEN: 'unused-outside-publish'

        steps:
        - uses: actions/checkout@v7
          with:
              fetch-depth: 0
              fetch-tags: true

        # Needs the full tag history fetched above. Shared XH action, SHA-pinned -
        # Dependabot keeps it current.
        - name: Validate release version
          uses: xh/hoist-dev-utils/.github/actions/validate-release-version@71d46b39323491a7fd5090e7b651958b05630fa0 # master
          with:
              version: ${{ inputs.version }}
              is-hotfix: ${{ inputs.is-hotfix }}

        # Installs the pnpm version pinned in package.json; install runs separately below.
        - name: Setup pnpm
          uses: pnpm/setup@v2
          with:
              install: false

        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
              node-version-file: '.nvmrc'
              registry-url: 'https://registry.npmjs.org'
              cache: 'pnpm'

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Smoke test config
          run: bash .github/scripts/smoke-test.sh

        # Version passed positionally - the legacy `--new-version` flag is no longer recognized.
        - name: Set release version in package.json
          env:
              VERSION: ${{ inputs.version }}
          run: pnpm version --no-git-tag-version "$VERSION"

        # `--no-git-checks`: pnpm's publish guards don't fit here - the version bump dirties
        # the tree and hotfixes run from non-master branches. Safety comes from the `if:`
        # guard and version validation above. Auth prefers OIDC, falling back to NPM_TOKEN;
        # no `--provenance` flag, as forcing it would break the token fallback.
        - name: Publish release to npm
          env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              IS_HOTFIX: ${{ inputs.is-hotfix }}
          run: |
              TAG_ARGS=()
              if [ "$IS_HOTFIX" = "true" ]; then
                  TAG_ARGS=(--tag hotfix)
              fi
              pnpm publish --no-git-checks "${TAG_ARGS[@]}"

        # The tag points to a commit where package.json still has the SNAPSHOT version -
        # intentional, the version bump is never committed back.
        - name: Create tag and GitHub release
          uses: xh/hoist-dev-utils/.github/actions/create-tag-and-github-release@a7698bfb83cd6b75f956c0a4d82fb3d6b07eab83 # master
          with:
              version: ${{ inputs.version }}
              is-hotfix: ${{ inputs.is-hotfix }}
          env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        # Best-effort only - a summary glitch must never fail an otherwise-good release.
        - name: Write job summary
          continue-on-error: true
          env:
              VERSION: ${{ inputs.version }}
          run: |
              {
                echo "### 📦 Release published to npm"
                echo ""
                echo "Version: [\`$VERSION\`](https://www.npmjs.com/package/@xh/eslint-config/v/$VERSION)"
              } >> "$GITHUB_STEP_SUMMARY"
