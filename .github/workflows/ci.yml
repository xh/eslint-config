# CI — Validates PRs: frozen-lockfile install, config smoke test, dependency audit.
# Publishing is handled by Deploy Snapshot / Deploy Release.

name: CI

on:
    pull_request:
    workflow_dispatch:

jobs:
    validate:

        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
        - uses: actions/checkout@v7

        # Installs the pnpm version pinned in package.json; install runs separately below.
        - name: Setup pnpm
          uses: pnpm/setup@v2
          with:
              install: false

        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
              node-version-file: '.nvmrc'
              cache: 'pnpm'

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Smoke test config
          run: bash .github/scripts/smoke-test.sh

        # Fail only on high/critical advisories; the first, un-gated run logs lower severities.
        - name: Audit production dependencies
          run: |
              pnpm audit --prod || true
              pnpm audit --prod --audit-level high
